plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.controlefinanceiro'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.controlefinanceiro'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use signing config when provided via project properties
            signingConfig signingConfigs.release
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('keystoreFile')) {
                storeFile file(project.property('keystoreFile'))
            }
            if (project.hasProperty('keystorePassword')) {
                storePassword project.property('keystorePassword')
            }
            if (project.hasProperty('keyAlias')) {
                keyAlias project.property('keyAlias')
            }
            if (project.hasProperty('keyPassword')) {
                keyPassword project.property('keyPassword')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
