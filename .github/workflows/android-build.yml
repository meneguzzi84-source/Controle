name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (needed for Android builds)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: |
          cd AndroidApp
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > AndroidApp/keystore.jks

      - name: Build signed release APK (if keystore provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cd AndroidApp
          gradle assembleRelease --no-daemon -PkeystoreFile=keystore.jks -PkeystorePassword="${{ secrets.KEYSTORE_PASSWORD }}" -PkeyAlias="${{ secrets.KEY_ALIAS }}" -PkeyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Upload signed release APK (if created)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-apk-release
          path: AndroidApp/app/build/outputs/apk/release/app-release.apk
